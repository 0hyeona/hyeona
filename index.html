<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hyeona's Portfolio</title>

  <link rel="stylesheet" href="./css/style.css" />
  <script src="./js/script.js" defer></script>
</head>

<body>
  <main>
    <!-- HERO -->

    <section class="portfolio-hero" id="hero" aria-labelledby="hero-title">
      <div class="hero-inner">
        <!-- TITLE -->

        <div class="hero-header">

          <h1 class="hero-title" id="hero-title">
            DESIGN
            PORTFOLIO
          </h1>
          <!-- CATEGORY -->

          <nav class="hero-categories" aria-label="Portfolio categories">
            <a href="#ui-design"> 01 UI DESIGN </a>

            <a href="#publishing"> 02 PUBLISHING </a>

            <a href="#web-project"> 03 WEB PROJECT </a>
          </nav>
        </div>

        <!-- HERO VISUAL -->

        <div class="hero-visual" aria-hidden="true">
          <!-- 뒤쪽 장식 -->

          <img class="hero-flourish" src="./img/background.svg" alt="배경 이미지" />

          <!-- 앞쪽 클로버 -->

          <div class="hero-symbol-wrap">
            <div class="hero-symbol-tilt">
              <div class="hero-symbol-rotator">
                <img src="./img/hero-symbol.svg" alt="클로버 이미지" class="hero-symbol hero-symbol-back">

                <img src="./img/hero-symbol.svg" alt="클로버 이미지" class="hero-symbol hero-symbol-depth">

                <img src="./img/hero-symbol.svg" alt="클로버 이미지" class="hero-symbol hero-symbol-front">
              </div>
            </div>
          </div>
        </div>

        <!-- BOTTOM META -->

        <div class="hero-meta">
          <!-- LEFT -->

          <p class="hero-intro">
            개발자의 언어로 사고하고,<br>
            사용자의 시선으로 구현하는
          </p>

          <!-- PROJECT BUTTON-->

          <div class="project-nav-wrap">
            <!-- 처음 보이는 버튼 -->

            <button class="hero-cta project-trigger" type="button" aria-expanded="false" aria-controls="project-menu">
              <span> VIEW PROJECTS </span>
            </button>

            <!-- 클릭하면 펼쳐지는 버튼 -->

            <nav class="project-menu" id="project-menu" aria-label="Project sections" aria-hidden="true">
              <a href="#visual"> VISUAL </a>

              <a href="#ui-design"> UI DESIGN </a>

              <a href="#puishing"> PUBLISHING </a>

              <a href="#experience"> EXPERIENCE </a>
            </nav>
          </div>

          <!-- RIGHT -->

          <p class="hero-role">
            UX/UI 퍼블리셔 <strong>김현아</strong>입니다.
          </p>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
